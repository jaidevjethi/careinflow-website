name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, but never kill one that is already running.
#
# This was `cancel-in-progress: true`, which is right for CI on a pull request
# and wrong for a production deploy. On 2026-08-06 four dispatches landed in
# seven minutes while GitHub Actions was in a major outage, and each cancelled
# the one before it — including a run that had already finished `build: success`
# and was on the publish step. Retrying always killed the deploy closest to
# finishing, so the site never went out.
#
# `false` is what GitHub's own Pages starter workflow ships. Queued runs still
# collapse to the latest, so a burst of pushes costs a few minutes rather than
# a lost deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # GitHub Pages mirror is served under /careinflow-website; canonical
      # URLs still point at https://careinflow.com (see src/config/site.ts).
      SITE: https://jaidevjethi.github.io
      BASE_PATH: /careinflow-website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Type and content-schema errors used to ship, because nothing ran
      # `astro check` in CI. This also runs the price guard, which fails the
      # build on any published figure that does not come from pricing.ts.
      - run: npm run check
      - run: npm run build
      # Re-run the price guard after the build so it can also scan the built
      # HTML for unresolved {{price}} tokens, and run the metadata guard, which
      # only works against built output: title and description budgets, one H1,
      # canonical host, robots directive, every internal link resolving with
      # its trailing slash, and JSON-LD that parses and claims nothing false.
      - run: npm run verify
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
