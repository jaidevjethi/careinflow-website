name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # GitHub Pages mirror is served under /careinflow-website; canonical
      # URLs still point at https://careinflow.com (see src/config/site.ts).
      SITE: https://jaidevjethi.github.io
      BASE_PATH: /careinflow-website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Type and content-schema errors used to ship, because nothing ran
      # `astro check` in CI. This also runs the price guard, which fails the
      # build on any published figure that does not come from pricing.ts.
      - run: npm run check
      - run: npm run build
      # Re-run after the build so the guard can also scan the built HTML for
      # unresolved {{price}} tokens.
      - run: npm run check:prices
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
